# ─────────────────────────────────────────────────────────────────────────────
#  Nginx — service du SPA Angular (CodeQuizzer Frontend)
#  • Routage côté client : tout chemin inconnu retombe sur index.html
#  • Cache agressif des assets hashés, jamais de cache sur index.html
#  • gzip + en-têtes de sécurité + endpoint /healthz pour les sondes
# ─────────────────────────────────────────────────────────────────────────────
server {
    listen       80;
    server_name  _;
    root   /usr/share/nginx/html;
    index  index.html;

    # Compression
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_comp_level   6;
    gzip_types        text/plain text/css application/javascript application/json
                      image/svg+xml application/xml font/ttf font/woff font/woff2;

    # Endpoint de santé (Docker HEALTHCHECK + futures sondes K8s liveness/readiness)
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # Assets hashés par Angular (outputHashing=all) → cache long & immuable.
    # Un seul en-tête Cache-Control (pas de `expires` en plus, qui en dupliquerait un).
    location ~* \.(?:js|css|woff2?|ttf|eot|otf|svg|png|jpe?g|gif|ico|webp|map)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html jamais mis en cache → chaque déploiement est pris en compte
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Routage SPA : fallback vers index.html (deep links Angular Router)
    location / {
        try_files $uri $uri/ /index.html;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Ne pas exposer la version de Nginx
    server_tokens off;
}
